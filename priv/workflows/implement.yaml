name: implement
version: 1
roles:
  implementer:
    provider: codex
    prompt: |
      You are the implementation role. Make the smallest complete change and preserve repository rules.
  verifier:
    provider: codex
    prompt: |
      You are the verification role. Require clear evidence before work can continue.
artifacts:
  implementation_result:
    type: object
    required:
      - status
      - harness_run_id
    properties:
      status: string
      harness_run_id: string
  verification_result:
    type: object
    required:
      - exit_status
    properties:
      exit_status: integer
steps:
  - name: preflight
    action: Hancho.Actions.Preflight
    params:
      repo_path: "$input.repo_path"
      issue_id: "$input.issue_id"
  - name: claim
    action: Hancho.Actions.ClaimIssue
    params:
      repo_path: "$steps.preflight.repo_path"
      issue: "$steps.preflight.issue"
  - name: create_worktree
    action: Hancho.Actions.CreateWorktree
    params:
      repo_path: "$steps.preflight.repo_path"
      baseline: "$steps.preflight.baseline"
      run_id: "$run.id"
  - name: render_prompt
    action: Hancho.Actions.RenderPrompt
    params:
      repo_path: "$steps.preflight.repo_path"
      prompt_file: implement.md
      context:
        issue: "$steps.claim.issue"
        demand: "$steps.preflight.demand"
  - name: implement
    role: implementer
    produces: implementation_result
    action: Hancho.Actions.Implement
    params:
      prompt: "$steps.render_prompt.rendered"
      repo_path: "$steps.preflight.repo_path"
      worktree_path: "$steps.create_worktree.worktree_path"
      timeout_ms: 1800000
      idle_timeout_ms: 300000
      andon_warning_ms: 120000
      productive_warning_ms: 120000
      progress_interval_ms: 30000
  - name: validate_scope
    role: verifier
    consumes:
      - implementation_result
    action: Hancho.Actions.ValidateScope
    params:
      worktree_path: "$steps.create_worktree.worktree_path"
      demand: "$steps.preflight.demand"
    on_error:
      codes:
        - changes_outside_allowed_scope
      repair_with: codex
      max_attempts: 1
      retry_step: validate_scope
  - name: verify
    role: verifier
    produces: verification_result
    action: Hancho.Actions.Verify
    params:
      repo_path: "$steps.preflight.repo_path"
      worktree_path: "$steps.create_worktree.worktree_path"
      executable: mix
      arguments:
        - test
      timeout_ms: 600000
    on_error:
      codes:
        - verification_failed
      repair_with: codex
      max_attempts: 1
      retry_step: verify
  - name: commit
    action: Hancho.Actions.Commit
    params:
      worktree_path: "$steps.create_worktree.worktree_path"
      baseline: "$steps.preflight.baseline"
      issue: "$steps.claim.issue"
  - name: land
    action: Hancho.Actions.Land
    params:
      repo_path: "$steps.preflight.repo_path"
      branch: "$steps.preflight.branch"
      baseline: "$steps.preflight.baseline"
      commit: "$steps.commit.commit"
  - name: remove_worktree
    action: Hancho.Actions.RemoveWorktree
    params:
      repo_path: "$steps.preflight.repo_path"
      worktree_path: "$steps.create_worktree.worktree_path"
  - name: close_issue
    action: Hancho.Actions.CloseIssue
    params:
      repo_path: "$steps.preflight.repo_path"
      issue_id: "$steps.claim.issue.id"
      commit: "$steps.commit.commit"
